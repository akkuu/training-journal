<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>トレーニング記録</title>
<meta name="description" content="ランニングと筋トレの日々の記録">
<meta name="theme-color" content="#f5f1e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f1e8;
  --ink: #1a1a1a;
  --paper: #faf7f0;
  --accent: #c8553d;
  --accent-soft: #e8a598;
  --success: #5d7c5a;
  --muted: #8a8479;
  --line: #d9d3c4;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Zen Kaku Gothic New', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  background-image:
    radial-gradient(circle at 10% 20%, rgba(200,85,61,0.04) 0%, transparent 50%),
    radial-gradient(circle at 90% 80%, rgba(93,124,90,0.04) 0%, transparent 50%);
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 32px 20px 80px;
}

header {
  text-align: center;
  margin-bottom: 32px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--line);
}

.eyebrow {
  font-family: 'Bodoni Moda', serif;
  font-style: italic;
  font-size: 14px;
  color: var(--muted);
  letter-spacing: 2px;
  margin-bottom: 8px;
}

h1 {
  font-family: 'Bodoni Moda', serif;
  font-size: clamp(32px, 6vw, 44px);
  font-weight: 700;
  letter-spacing: -1px;
  line-height: 1.1;
}

h1 .jp {
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-weight: 500;
  font-size: 0.55em;
  display: block;
  margin-top: 8px;
  letter-spacing: 6px;
  color: var(--ink);
}

.date-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 16px 20px;
  margin-bottom: 24px;
}

.date-nav button {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: var(--ink);
  padding: 8px 12px;
  border-radius: 4px;
}

.date-display { text-align: center; flex: 1; }

.date-main {
  font-family: 'Bodoni Moda', serif;
  font-size: 22px;
  font-weight: 700;
}

.date-sub {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 2px;
  margin-top: 4px;
}

.today-btn {
  display: block;
  margin: 12px auto 0;
  font-size: 11px;
  color: var(--accent);
  background: none;
  border: none;
  cursor: pointer;
  letter-spacing: 1px;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 24px;
  margin-bottom: 20px;
}

.section-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}

.section-title {
  font-family: 'Bodoni Moda', serif;
  font-size: 24px;
  font-weight: 700;
}

.section-title-jp {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 3px;
  margin-top: 2px;
}

.section-count {
  font-family: 'Bodoni Moda', serif;
  font-size: 14px;
  color: var(--muted);
  font-style: italic;
}

.task {
  display: flex;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px dashed var(--line);
  cursor: pointer;
}

.task:last-child { border-bottom: none; }

.task-checkbox {
  width: 26px;
  height: 26px;
  border: 1.5px solid var(--ink);
  border-radius: 50%;
  margin-right: 16px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s;
}

.task.done .task-checkbox {
  background: var(--success);
  border-color: var(--success);
}

.task.done .task-checkbox::after {
  content: '✓';
  color: white;
  font-size: 14px;
  font-weight: bold;
}

.task-info { flex: 1; }

.task-name {
  font-size: 15px;
  font-weight: 500;
}

.task-meta {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}

.task.done .task-name {
  text-decoration: line-through;
  color: var(--muted);
}

.run-input {
  display: flex;
  gap: 12px;
  margin-top: 16px;
  align-items: center;
  flex-wrap: wrap;
}

.run-input label {
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 1px;
}

.run-input input {
  flex: 1;
  min-width: 100px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 4px;
  font-family: inherit;
  font-size: 15px;
  background: var(--bg);
  color: var(--ink);
}

.run-input input:focus {
  outline: none;
  border-color: var(--accent);
}

.notes {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 4px;
  font-family: inherit;
  font-size: 14px;
  background: var(--bg);
  color: var(--ink);
  resize: vertical;
  min-height: 70px;
  margin-top: 12px;
}

.notes:focus { outline: none; border-color: var(--accent); }

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}

.stat {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 20px 16px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.stat::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--accent);
}

.stat:nth-child(2)::before { background: var(--success); }
.stat:nth-child(3)::before { background: var(--ink); }

.stat-value {
  font-family: 'Bodoni Moda', serif;
  font-size: 36px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 6px;
}

.stat-label {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.stat-label-jp {
  font-size: 11px;
  color: var(--ink);
  margin-top: 4px;
  letter-spacing: 1px;
}

.calendar {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 24px;
  margin-bottom: 20px;
}

.cal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.cal-month {
  font-family: 'Bodoni Moda', serif;
  font-size: 18px;
  font-weight: 700;
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}

.cal-day-header {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 1px;
  padding: 6px 0;
}

.cal-cell {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  border-radius: 4px;
  cursor: pointer;
  position: relative;
}

.cal-cell.empty { cursor: default; }
.cal-cell.today { font-weight: 700; color: var(--accent); }

.cal-cell .dot {
  position: absolute;
  bottom: 4px;
  display: flex;
  gap: 2px;
}

.cal-cell .dot span {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--success);
}

.cal-cell .dot span.run { background: var(--accent); }

.cal-cell.selected {
  background: var(--ink);
  color: var(--paper);
}

.cal-cell.selected.today { color: var(--accent-soft); }

@media (max-width: 480px) {
  .container { padding: 20px 14px 60px; }
  .stats { gap: 10px; }
  .stat { padding: 16px 8px; }
  .stat-value { font-size: 28px; }
  .section { padding: 18px; }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.section, .stat, .calendar { animation: fadeIn 0.5s ease-out; }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="eyebrow">DAILY TRAINING LOG</div>
    <h1>Training Journal<span class="jp">トレーニング記録</span></h1>
  </header>

  <div id="app"></div>

</div>

<script>
const STORAGE_KEY = 'training_data_v1';

const EXERCISES = [
  { id: 'squat', name: 'スクワット', meta: '10回 × 2セット' },
  { id: 'pushup', name: '膝つき腕立て伏せ', meta: '5〜10回 × 2セット' },
  { id: 'plank', name: 'プランク', meta: '20〜30秒 × 2セット' },
  { id: 'hiplift', name: 'ヒップリフト', meta: '10回 × 2セット' },
  { id: 'crunch', name: 'クランチ', meta: '10回 × 2セット' },
];

let currentDate0 = new Date();
currentDate0.setHours(0, 0, 0, 0);
let viewDate = new Date(currentDate0);
let calMonth = new Date(currentDate0.getFullYear(), currentDate0.getMonth(), 1);

function loadAll() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveAll(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.error('保存に失敗しました', e);
  }
}

function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function formatDate(d) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return {
    main: `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`,
    sub: days[d.getDay()]
  };
}

function getRecord(all, date) {
  return all[dateKey(date)] || { ran: false, runDistance: '', runTime: '', exercises: {}, notes: '' };
}

function setRecord(all, date, record) {
  all[dateKey(date)] = record;
  saveAll(all);
}

function calcStats(all) {
  const today0 = new Date();
  today0.setHours(0, 0, 0, 0);

  let streak = 0;
  let d = new Date(today0);
  for (let i = 0; i < 365; i++) {
    const rec = all[dateKey(d)];
    const hasActivity = rec && (rec.ran || (rec.exercises && Object.values(rec.exercises).some(v => v)));
    if (hasActivity) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else {
      if (i === 0) {
        d.setDate(d.getDate() - 1);
        continue;
      }
      break;
    }
  }

  const weekStart = new Date(today0);
  weekStart.setDate(weekStart.getDate() - weekStart.getDay());
  let weekRuns = 0;
  let weekStrength = 0;
  for (let i = 0; i < 7; i++) {
    const d2 = new Date(weekStart);
    d2.setDate(d2.getDate() + i);
    const rec = all[dateKey(d2)];
    if (rec && rec.ran) weekRuns++;
    if (rec && rec.exercises && Object.values(rec.exercises).some(v => v)) weekStrength++;
  }

  return { streak, weekRuns, weekStrength };
}

function render() {
  const all = loadAll();
  const record = getRecord(all, viewDate);
  const stats = calcStats(all);
  const dateInfo = formatDate(viewDate);
  const isToday = dateKey(viewDate) === dateKey(currentDate0);
  const app = document.getElementById('app');

  app.innerHTML = `
    <div class="stats">
      <div class="stat">
        <div class="stat-value">${stats.streak}</div>
        <div class="stat-label">STREAK</div>
        <div class="stat-label-jp">連続日数</div>
      </div>
      <div class="stat">
        <div class="stat-value">${stats.weekRuns}</div>
        <div class="stat-label">RUNS / WEEK</div>
        <div class="stat-label-jp">今週ラン</div>
      </div>
      <div class="stat">
        <div class="stat-value">${stats.weekStrength}</div>
        <div class="stat-label">STRENGTH / WEEK</div>
        <div class="stat-label-jp">今週筋トレ</div>
      </div>
    </div>

    <div class="date-nav">
      <button id="prevDay">‹</button>
      <div class="date-display">
        <div class="date-main">${dateInfo.main}</div>
        <div class="date-sub">${dateInfo.sub}</div>
      </div>
      <button id="nextDay">›</button>
    </div>
    ${!isToday ? '<button class="today-btn" id="todayBtn">今日に戻る →</button>' : ''}

    <div class="section">
      <div class="section-header">
        <div>
          <div class="section-title">Running</div>
          <div class="section-title-jp">ランニング</div>
        </div>
        <div class="section-count">${record.ran ? '✓ 完了' : '未実施'}</div>
      </div>
      <div class="task ${record.ran ? 'done' : ''}" id="runTask">
        <div class="task-checkbox"></div>
        <div class="task-info">
          <div class="task-name">今日のランニング</div>
          <div class="task-meta">タップして完了マーク</div>
        </div>
      </div>
      ${record.ran ? `
        <div class="run-input">
          <label>距離</label>
          <input type="text" id="runDistance" value="${record.runDistance || ''}" placeholder="例: 3.5km">
          <label>時間</label>
          <input type="text" id="runTime" value="${record.runTime || ''}" placeholder="例: 25分">
        </div>
      ` : ''}
    </div>

    <div class="section">
      <div class="section-header">
        <div>
          <div class="section-title">Strength</div>
          <div class="section-title-jp">筋トレ</div>
        </div>
        <div class="section-count">${Object.values(record.exercises || {}).filter(v => v).length} / ${EXERCISES.length}</div>
      </div>
      ${EXERCISES.map(ex => `
        <div class="task ${record.exercises && record.exercises[ex.id] ? 'done' : ''}" data-ex="${ex.id}">
          <div class="task-checkbox"></div>
          <div class="task-info">
            <div class="task-name">${ex.name}</div>
            <div class="task-meta">${ex.meta}</div>
          </div>
        </div>
      `).join('')}
    </div>

    <div class="section">
      <div class="section-header">
        <div>
          <div class="section-title">Notes</div>
          <div class="section-title-jp">今日のメモ</div>
        </div>
      </div>
      <textarea class="notes" id="notes" placeholder="体調や気づきを記録...">${record.notes || ''}</textarea>
    </div>

    <div class="calendar">
      <div class="cal-header">
        <button id="prevMonth" style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink);padding:4px 10px;">‹</button>
        <div class="cal-month">${['January','February','March','April','May','June','July','August','September','October','November','December'][calMonth.getMonth()]} ${calMonth.getFullYear()}</div>
        <button id="nextMonth" style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink);padding:4px 10px;">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div style="margin-top:12px;display:flex;gap:16px;justify-content:center;font-size:11px;color:var(--muted);letter-spacing:1px;">
        <span><span style="display:inline-block;width:6px;height:6px;background:var(--accent);border-radius:50%;margin-right:6px;"></span>ラン</span>
        <span><span style="display:inline-block;width:6px;height:6px;background:var(--success);border-radius:50%;margin-right:6px;"></span>筋トレ</span>
      </div>
    </div>
  `;

  renderCalendar(all);
  attachEvents(all, record);
}

function renderCalendar(all) {
  const grid = document.getElementById('calGrid');
  if (!grid) return;
  const dayHeaders = ['S','M','T','W','T','F','S'];
  let html = dayHeaders.map(d => `<div class="cal-day-header">${d}</div>`).join('');

  const firstDay = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
  const lastDay = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 0);
  const startWeekday = firstDay.getDay();

  for (let i = 0; i < startWeekday; i++) {
    html += '<div class="cal-cell empty"></div>';
  }

  for (let day = 1; day <= lastDay.getDate(); day++) {
    const d = new Date(calMonth.getFullYear(), calMonth.getMonth(), day);
    const key = dateKey(d);
    const rec = all[key];
    const isToday = key === dateKey(currentDate0);
    const isSelected = key === dateKey(viewDate);
    const dots = [];
    if (rec && rec.ran) dots.push('<span class="run"></span>');
    if (rec && rec.exercises && Object.values(rec.exercises).some(v => v)) dots.push('<span></span>');
    html += `<div class="cal-cell ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" data-day="${day}">
      ${day}
      ${dots.length ? `<div class="dot">${dots.join('')}</div>` : ''}
    </div>`;
  }

  grid.innerHTML = html;
  grid.querySelectorAll('.cal-cell[data-day]').forEach(cell => {
    cell.addEventListener('click', () => {
      const day = parseInt(cell.dataset.day);
      viewDate = new Date(calMonth.getFullYear(), calMonth.getMonth(), day);
      render();
    });
  });
}

function attachEvents(all, record) {
  document.getElementById('prevDay').onclick = () => {
    viewDate.setDate(viewDate.getDate() - 1);
    render();
  };
  document.getElementById('nextDay').onclick = () => {
    viewDate.setDate(viewDate.getDate() + 1);
    render();
  };

  const todayBtn = document.getElementById('todayBtn');
  if (todayBtn) {
    todayBtn.onclick = () => {
      viewDate = new Date(currentDate0);
      render();
    };
  }

  document.getElementById('runTask').onclick = () => {
    record.ran = !record.ran;
    setRecord(all, viewDate, record);
    render();
  };

  const runDistance = document.getElementById('runDistance');
  const runTime = document.getElementById('runTime');
  if (runDistance) {
    runDistance.addEventListener('change', (e) => {
      record.runDistance = e.target.value;
      setRecord(all, viewDate, record);
    });
  }
  if (runTime) {
    runTime.addEventListener('change', (e) => {
      record.runTime = e.target.value;
      setRecord(all, viewDate, record);
    });
  }

  document.querySelectorAll('.task[data-ex]').forEach(task => {
    task.onclick = () => {
      const exId = task.dataset.ex;
      if (!record.exercises) record.exercises = {};
      record.exercises[exId] = !record.exercises[exId];
      setRecord(all, viewDate, record);
      render();
    };
  });

  document.getElementById('notes').addEventListener('change', (e) => {
    record.notes = e.target.value;
    setRecord(all, viewDate, record);
  });

  document.getElementById('prevMonth').onclick = () => {
    calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1);
    render();
  };
  document.getElementById('nextMonth').onclick = () => {
    calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1);
    render();
  };
}

render();

// PWA: Service Worker登録（オフライン対応）
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW登録失敗:', err));
  });
}
</script>
</body>
</html>
