<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>トレーニング記録</title>
<meta name="description" content="ランニングと筋トレの日々の記録">
<meta name="theme-color" content="#f5f1e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f1e8;
  --ink: #1a1a1a;
  --paper: #faf7f0;
  --accent: #c8553d;
  --accent-soft: #e8a598;
  --success: #5d7c5a;
  --muted: #8a8479;
  --line: #d9d3c4;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Zen Kaku Gothic New', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  background-image:
    radial-gradient(circle at 10% 20%, rgba(200,85,61,0.04) 0%, transparent 50%),
    radial-gradient(circle at 90% 80%, rgba(93,124,90,0.04) 0%, transparent 50%);
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 32px 20px 80px;
}

header {
  text-align: center;
  margin-bottom: 24px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--line);
}

.eyebrow {
  font-family: 'Bodoni Moda', serif;
  font-style: italic;
  font-size: 14px;
  color: var(--muted);
  letter-spacing: 2px;
  margin-bottom: 8px;
}

h1 {
  font-family: 'Bodoni Moda', serif;
  font-size: clamp(32px, 6vw, 44px);
  font-weight: 700;
  letter-spacing: -1px;
  line-height: 1.1;
}

h1 .jp {
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-weight: 500;
  font-size: 0.55em;
  display: block;
  margin-top: 8px;
  letter-spacing: 6px;
  color: var(--ink);
}

/* タブナビ */
.tabs {
  display: flex;
  gap: 0;
  margin-bottom: 28px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 4px;
}

.tab {
  flex: 1;
  padding: 12px 8px;
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
  color: var(--muted);
  border-radius: 3px;
  transition: all 0.2s;
  font-weight: 500;
  letter-spacing: 1px;
}

.tab.active {
  background: var(--ink);
  color: var(--paper);
}

.tab-jp {
  font-size: 10px;
  display: block;
  margin-top: 2px;
  letter-spacing: 2px;
}

.date-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 16px 20px;
  margin-bottom: 24px;
}

.date-nav button {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: var(--ink);
  padding: 8px 12px;
  border-radius: 4px;
}

.date-display { text-align: center; flex: 1; }

.date-main {
  font-family: 'Bodoni Moda', serif;
  font-size: 22px;
  font-weight: 700;
}

.date-sub {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 2px;
  margin-top: 4px;
}

.today-btn {
  display: block;
  margin: 12px auto 0;
  font-size: 11px;
  color: var(--accent);
  background: none;
  border: none;
  cursor: pointer;
  letter-spacing: 1px;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 24px;
  margin-bottom: 20px;
}

.section-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}

.section-title {
  font-family: 'Bodoni Moda', serif;
  font-size: 24px;
  font-weight: 700;
}

.section-title-jp {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 3px;
  margin-top: 2px;
}

.section-count {
  font-family: 'Bodoni Moda', serif;
  font-size: 14px;
  color: var(--muted);
  font-style: italic;
}

.task {
  display: flex;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px dashed var(--line);
  cursor: pointer;
}

.task:last-child { border-bottom: none; }

.task-checkbox {
  width: 26px;
  height: 26px;
  border: 1.5px solid var(--ink);
  border-radius: 50%;
  margin-right: 16px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s;
}

.task.done .task-checkbox {
  background: var(--success);
  border-color: var(--success);
}

.task.done .task-checkbox::after {
  content: '✓';
  color: white;
  font-size: 14px;
  font-weight: bold;
}

.task-info { flex: 1; }

.task-name {
  font-size: 15px;
  font-weight: 500;
}

.task-meta {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}

.task.done .task-name {
  text-decoration: line-through;
  color: var(--muted);
}

.info-btn {
  background: none;
  border: 1px solid var(--line);
  border-radius: 50%;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  margin-left: 8px;
  flex-shrink: 0;
  font-family: 'Bodoni Moda', serif;
  font-style: italic;
  font-size: 14px;
  color: var(--muted);
  transition: all 0.2s;
}

.info-btn:hover {
  background: var(--bg);
  color: var(--accent);
  border-color: var(--accent);
}

.run-input {
  display: flex;
  gap: 12px;
  margin-top: 16px;
  align-items: center;
  flex-wrap: wrap;
}

.run-input label {
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 1px;
}

.run-input input {
  flex: 1;
  min-width: 100px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 4px;
  font-family: inherit;
  font-size: 15px;
  background: var(--bg);
  color: var(--ink);
}

.run-input input:focus { outline: none; border-color: var(--accent); }

.notes {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 4px;
  font-family: inherit;
  font-size: 14px;
  background: var(--bg);
  color: var(--ink);
  resize: vertical;
  min-height: 70px;
  margin-top: 12px;
}

.notes:focus { outline: none; border-color: var(--accent); }

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}

.stat {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 20px 16px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.stat::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--accent);
}

.stat:nth-child(2)::before { background: var(--success); }
.stat:nth-child(3)::before { background: var(--ink); }

.stat-value {
  font-family: 'Bodoni Moda', serif;
  font-size: 36px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 6px;
}

.stat-label {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.stat-label-jp {
  font-size: 11px;
  color: var(--ink);
  margin-top: 4px;
  letter-spacing: 1px;
}

.calendar {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 24px;
  margin-bottom: 20px;
}

.cal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.cal-month {
  font-family: 'Bodoni Moda', serif;
  font-size: 18px;
  font-weight: 700;
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}

.cal-day-header {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 1px;
  padding: 6px 0;
}

.cal-cell {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  border-radius: 4px;
  cursor: pointer;
  position: relative;
}

.cal-cell.empty { cursor: default; }
.cal-cell.today { font-weight: 700; color: var(--accent); }

.cal-cell .dot {
  position: absolute;
  bottom: 4px;
  display: flex;
  gap: 2px;
}

.cal-cell .dot span {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--success);
}

.cal-cell .dot span.run { background: var(--accent); }

.cal-cell.selected {
  background: var(--ink);
  color: var(--paper);
}

.cal-cell.selected.today { color: var(--accent-soft); }

/* ガイド画面 */
.guide-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 24px;
  margin-bottom: 20px;
}

.guide-h1 {
  font-family: 'Bodoni Moda', serif;
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 4px;
  color: var(--accent);
}

.guide-h1-jp {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 3px;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}

.guide-h2 {
  font-family: 'Bodoni Moda', serif;
  font-size: 18px;
  font-weight: 700;
  margin-top: 22px;
  margin-bottom: 10px;
  color: var(--ink);
}

.guide-h2:first-of-type { margin-top: 0; }

.guide-text {
  font-size: 14px;
  line-height: 1.8;
  margin-bottom: 10px;
}

.guide-text strong { color: var(--accent); }

.guide-list {
  list-style: none;
  padding: 0;
}

.guide-list li {
  font-size: 14px;
  line-height: 1.7;
  padding-left: 18px;
  position: relative;
  margin-bottom: 6px;
}

.guide-list li::before {
  content: '•';
  color: var(--accent);
  position: absolute;
  left: 4px;
  font-weight: bold;
}

.guide-list-num {
  counter-reset: step;
  list-style: none;
  padding: 0;
}

.guide-list-num li {
  font-size: 14px;
  line-height: 1.7;
  padding-left: 28px;
  position: relative;
  margin-bottom: 8px;
  counter-increment: step;
}

.guide-list-num li::before {
  content: counter(step);
  position: absolute;
  left: 0;
  top: 0;
  width: 20px;
  height: 20px;
  background: var(--ink);
  color: var(--paper);
  border-radius: 50%;
  font-size: 11px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Bodoni Moda', serif;
}

.guide-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin: 12px 0;
}

.guide-table th, .guide-table td {
  padding: 10px 8px;
  text-align: left;
  border-bottom: 1px solid var(--line);
}

.guide-table th {
  background: var(--bg);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
}

.tip-box {
  background: var(--bg);
  border-left: 3px solid var(--accent);
  padding: 12px 14px;
  margin: 12px 0;
  font-size: 13px;
  line-height: 1.6;
}

.tip-box strong { color: var(--accent); }

.exercise-card {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 18px;
  margin-bottom: 14px;
}

.exercise-num {
  font-family: 'Bodoni Moda', serif;
  font-style: italic;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 2px;
}

.exercise-title {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 4px;
}

.exercise-target {
  font-size: 12px;
  color: var(--accent);
  margin-bottom: 12px;
  letter-spacing: 1px;
}

.exercise-h3 {
  font-family: 'Bodoni Moda', serif;
  font-size: 13px;
  font-weight: 700;
  margin-top: 12px;
  margin-bottom: 6px;
  color: var(--ink);
  letter-spacing: 1px;
}

/* モーダル */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
  animation: fadeIn 0.2s ease-out;
}

.modal-overlay.active { display: flex; }

.modal {
  background: var(--paper);
  border-radius: 6px;
  max-width: 500px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  padding: 28px;
  position: relative;
  animation: fadeIn 0.3s ease-out;
}

.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: var(--muted);
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
}

.modal-close:hover { background: var(--bg); }

@media (max-width: 480px) {
  .container { padding: 20px 14px 60px; }
  .stats { gap: 10px; }
  .stat { padding: 16px 8px; }
  .stat-value { font-size: 28px; }
  .section, .guide-section { padding: 18px; }
  .tab { font-size: 13px; padding: 10px 4px; }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.section, .stat, .calendar, .guide-section { animation: fadeIn 0.4s ease-out; }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="eyebrow">DAILY TRAINING LOG</div>
    <h1>Training Journal<span class="jp">トレーニング記録</span></h1>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="log">LOG<span class="tab-jp">記録</span></button>
    <button class="tab" data-tab="running">RUNNING<span class="tab-jp">ランニング</span></button>
    <button class="tab" data-tab="strength">STRENGTH<span class="tab-jp">筋トレ</span></button>
  </div>

  <div id="app"></div>

</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" id="modalClose">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'training_data_v1';

const EXERCISES = [
  {
    id: 'squat',
    name: 'スクワット',
    meta: '10回 × 2セット',
    target: '下半身（太もも・お尻）',
    steps: [
      '足を肩幅に開き、つま先は少し外向き（15度くらい）',
      '背筋をまっすぐ伸ばし、胸を張る',
      'お尻を後ろに引くように、椅子に座るイメージでゆっくり腰を下ろす',
      '太ももが床と平行になるくらいまで下げる',
      'かかとで床を押すように立ち上がる',
    ],
    points: [
      '膝がつま先より前に出すぎないように',
      '膝とつま先は同じ方向に向ける（内股にならない）',
      '背中を丸めない、反らせすぎない',
      '下ろす2秒、上がる1秒のゆっくりペース',
      '呼吸：下ろす時に吸って、上がる時に吐く',
    ],
    tip: '最初は椅子を後ろに置き、お尻が軽く触れたら立ち上がる「ボックススクワット」がおすすめ。',
  },
  {
    id: 'pushup',
    name: '膝つき腕立て伏せ',
    meta: '5〜10回 × 2セット',
    target: '胸・腕',
    steps: [
      '床に膝をつき、手は肩幅より少し広めに置く',
      '膝から頭まで一直線になるように体を伸ばす',
      '肘を曲げて胸を床に近づける（床から拳1つ分まで）',
      '胸の筋肉を使って押し上げる',
    ],
    points: [
      'お尻を突き出さない、腰を反らせない',
      '肘は外に開きすぎず、体に対して45度くらい',
      '下ろす2秒、上げる1秒',
    ],
    tip: 'きつければ膝の位置を手から遠ざけると楽になります。',
  },
  {
    id: 'plank',
    name: 'プランク',
    meta: '20〜30秒 × 2セット',
    target: '体幹',
    steps: [
      'うつ伏せになり、肘を肩の真下につく',
      'つま先を立てて、体を持ち上げる',
      '頭・肩・腰・かかとが一直線になるようキープ',
      'お腹に力を入れて20〜30秒静止',
    ],
    points: [
      'お尻が上がりすぎ・下がりすぎに注意（横から見て一直線）',
      '顔は下向き、首はリラックス',
      '呼吸を止めない、自然に続ける',
    ],
    tip: 'きつければ膝をついてもOK。',
  },
  {
    id: 'hiplift',
    name: 'ヒップリフト',
    meta: '10回 × 2セット',
    target: 'お尻・腰回り',
    steps: [
      '仰向けに寝て、膝を立てる（足は腰幅）',
      'かかとはお尻から拳1〜2個分の位置',
      'お尻に力を入れて、ゆっくり持ち上げる',
      '肩〜膝が一直線になる位置で1〜2秒キープ',
      'ゆっくり下ろす（床にお尻をつけずに繰り返すとより効く）',
    ],
    points: [
      '腰を反らせすぎない、お尻の力で上げる',
      'かかとで床を押すイメージ',
      '上げる時に息を吐く',
    ],
    tip: 'お尻にしっかり効いているか意識しながら動かしましょう。',
  },
  {
    id: 'crunch',
    name: 'クランチ',
    meta: '10回 × 2セット',
    target: 'お腹',
    steps: [
      '仰向けで膝を立てる',
      '手は頭の後ろか胸の前でクロス',
      'おへそを覗き込むように、肩甲骨が床から離れるまで上体を起こす',
      'ゆっくり戻る（頭は床につけない）',
    ],
    points: [
      '起き上がるのは30度くらいでOK、完全に起きなくていい',
      '首の力で上げない（手で頭を引っ張らない）',
      'お腹を縮める意識',
      '上げる時に息を吐く',
    ],
    tip: '首が痛くなる場合は手の位置を胸の前に変えてみましょう。',
  },
];

let currentTab = 'log';
let currentDate0 = new Date();
currentDate0.setHours(0, 0, 0, 0);
let viewDate = new Date(currentDate0);
let calMonth = new Date(currentDate0.getFullYear(), currentDate0.getMonth(), 1);

function loadAll() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}

function saveAll(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  catch (e) { console.error('保存失敗', e); }
}

function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function formatDate(d) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return {
    main: months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(),
    sub: days[d.getDay()]
  };
}

function getRecord(all, date) {
  return all[dateKey(date)] || { ran: false, runDistance: '', runTime: '', exercises: {}, notes: '' };
}

function setRecord(all, date, record) {
  all[dateKey(date)] = record;
  saveAll(all);
}

function calcStats(all) {
  const today0 = new Date();
  today0.setHours(0, 0, 0, 0);
  let streak = 0;
  let d = new Date(today0);
  for (let i = 0; i < 365; i++) {
    const rec = all[dateKey(d)];
    const hasActivity = rec && (rec.ran || (rec.exercises && Object.values(rec.exercises).some(v => v)));
    if (hasActivity) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else {
      if (i === 0) { d.setDate(d.getDate() - 1); continue; }
      break;
    }
  }
  const weekStart = new Date(today0);
  weekStart.setDate(weekStart.getDate() - weekStart.getDay());
  let weekRuns = 0, weekStrength = 0;
  for (let i = 0; i < 7; i++) {
    const d2 = new Date(weekStart);
    d2.setDate(d2.getDate() + i);
    const rec = all[dateKey(d2)];
    if (rec && rec.ran) weekRuns++;
    if (rec && rec.exercises && Object.values(rec.exercises).some(v => v)) weekStrength++;
  }
  return { streak, weekRuns, weekStrength };
}

function render() {
  const app = document.getElementById('app');
  if (currentTab === 'log') {
    app.innerHTML = renderLogTab();
    renderCalendar(loadAll());
    attachLogEvents();
  } else if (currentTab === 'running') {
    app.innerHTML = renderRunningTab();
  } else if (currentTab === 'strength') {
    app.innerHTML = renderStrengthTab();
  }
  window.scrollTo(0, 0);
}

function renderCalendar(all) {
  const grid = document.getElementById('calGrid');
  if (!grid) return;
  const dayHeaders = ['S','M','T','W','T','F','S'];
  let html = dayHeaders.map(d => `<div class="cal-day-header">${d}</div>`).join('');
  const firstDay = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
  const lastDay = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 0);
  const startWeekday = firstDay.getDay();
  for (let i = 0; i < startWeekday; i++) {
    html += '<div class="cal-cell empty"></div>';
  }
  for (let day = 1; day <= lastDay.getDate(); day++) {
    const d = new Date(calMonth.getFullYear(), calMonth.getMonth(), day);
    const key = dateKey(d);
    const rec = all[key];
    const isToday = key === dateKey(currentDate0);
    const isSelected = key === dateKey(viewDate);
    const dots = [];
    if (rec && rec.ran) dots.push('<span class="run"></span>');
    if (rec && rec.exercises && Object.values(rec.exercises).some(v => v)) dots.push('<span></span>');
    html += `<div class="cal-cell ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" data-day="${day}">
      ${day}${dots.length ? `<div class="dot">${dots.join('')}</div>` : ''}
    </div>`;
  }
  grid.innerHTML = html;
  grid.querySelectorAll('.cal-cell[data-day]').forEach(cell => {
    cell.addEventListener('click', () => {
      const day = parseInt(cell.dataset.day);
      viewDate = new Date(calMonth.getFullYear(), calMonth.getMonth(), day);
      render();
    });
  });
}

function attachLogEvents() {
  const all = loadAll();
  const record = getRecord(all, viewDate);

  document.getElementById('prevDay').onclick = () => {
    viewDate.setDate(viewDate.getDate() - 1);
    render();
  };
  document.getElementById('nextDay').onclick = () => {
    viewDate.setDate(viewDate.getDate() + 1);
    render();
  };
  const todayBtn = document.getElementById('todayBtn');
  if (todayBtn) {
    todayBtn.onclick = () => { viewDate = new Date(currentDate0); render(); };
  }

  document.getElementById('runTask').onclick = () => {
    record.ran = !record.ran;
    setRecord(all, viewDate, record);
    render();
  };

  const runDistance = document.getElementById('runDistance');
  const runTime = document.getElementById('runTime');
  if (runDistance) {
    runDistance.addEventListener('change', (e) => {
      record.runDistance = e.target.value;
      setRecord(all, viewDate, record);
    });
  }
  if (runTime) {
    runTime.addEventListener('change', (e) => {
      record.runTime = e.target.value;
      setRecord(all, viewDate, record);
    });
  }

  // 筋トレタスク（チェックボックスと名前部分でトグル）
  document.querySelectorAll('[data-ex]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const exId = el.dataset.ex;
      if (!record.exercises) record.exercises = {};
      record.exercises[exId] = !record.exercises[exId];
      setRecord(all, viewDate, record);
      render();
    };
  });

  // インフォボタン（モーダル表示）
  document.querySelectorAll('[data-info]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      showExerciseModal(btn.dataset.info);
    };
  });

  document.getElementById('notes').addEventListener('change', (e) => {
    record.notes = e.target.value;
    setRecord(all, viewDate, record);
  });

  document.getElementById('prevMonth').onclick = () => {
    calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1);
    render();
  };
  document.getElementById('nextMonth').onclick = () => {
    calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1);
    render();
  };
}

function showExerciseModal(exId) {
  const ex = EXERCISES.find(e => e.id === exId);
  if (!ex) return;
  const content = document.getElementById('modalContent');
  content.innerHTML = `
    <div class="exercise-num">EXERCISE</div>
    <div class="exercise-title" style="font-size:22px;">${ex.name}</div>
    <div class="exercise-target">▸ ${ex.target}　|　${ex.meta}</div>

    <div class="exercise-h3">HOW TO</div>
    <ol class="guide-list-num">
      ${ex.steps.map(s => `<li>${s}</li>`).join('')}
    </ol>

    <div class="exercise-h3">POINTS</div>
    <ul class="guide-list">
      ${ex.points.map(p => `<li>${p}</li>`).join('')}
    </ul>

    <div class="tip-box">
      <strong>💡 コツ：</strong>${ex.tip}
    </div>
  `;
  document.getElementById('modal').classList.add('active');
}

// タブ切り替え
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    render();
  };
});

// モーダル閉じる
document.getElementById('modalClose').onclick = () => {
  document.getElementById('modal').classList.remove('active');
};
document.getElementById('modal').onclick = (e) => {
  if (e.target.id === 'modal') {
    document.getElementById('modal').classList.remove('active');
  }
};

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW登録失敗:', err));
  });
}
</script>
</body>
</html>
